<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CUSB RAG Live</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f7f4;
        --panel: #ffffff;
        --text: #22211f;
        --muted: #746a60;
        --line: #ddd5ca;
        --brand: #8f1d10;
        --brand-dark: #6f150b;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      .shell {
        display: grid;
        min-height: 100vh;
        grid-template-columns: 280px 1fr;
      }

      aside {
        border-right: 1px solid var(--line);
        background: #fbfaf8;
        padding: 18px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      .brand img {
        width: 52px;
        height: 52px;
        object-fit: contain;
        border-radius: 50%;
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 17px;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
        line-height: 1.5;
      }

      .status {
        margin-top: 18px;
        padding: 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        font-size: 13px;
        line-height: 1.5;
        white-space: pre-wrap;
      }

      main {
        display: flex;
        min-width: 0;
        flex-direction: column;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 1;
        border-bottom: 1px solid var(--line);
        background: rgba(247, 247, 244, 0.95);
        padding: 16px 24px;
        backdrop-filter: blur(8px);
      }

      .chat {
        flex: 1;
        overflow: auto;
        padding: 28px 24px;
      }

      .inner {
        max-width: 900px;
        margin: 0 auto;
      }

      .empty {
        min-height: 46vh;
        display: grid;
        place-items: center;
        text-align: center;
      }

      .empty h2 {
        margin-top: 18px;
        font-size: 28px;
      }

      .examples {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
        margin-top: 24px;
      }

      button,
      input,
      textarea {
        font: inherit;
      }

      button {
        cursor: pointer;
        border: 0;
      }

      .example,
      .secondary {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        color: var(--text);
        padding: 12px;
        text-align: left;
      }

      .turn {
        margin-bottom: 28px;
      }

      .query {
        margin-left: auto;
        max-width: 78%;
        width: fit-content;
        border-radius: 8px;
        background: var(--brand);
        color: white;
        padding: 12px 14px;
        line-height: 1.55;
      }

      .answer {
        margin-top: 14px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 15px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .sources {
        margin-top: 8px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .source {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: #fbfaf8;
        padding: 6px 10px;
        color: var(--muted);
        font-size: 12px;
      }

      footer {
        border-top: 1px solid var(--line);
        padding: 16px 24px;
        background: var(--bg);
      }

      form {
        max-width: 900px;
        margin: 0 auto;
      }

      .composer {
        display: flex;
        gap: 10px;
        align-items: end;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel);
        padding: 10px;
      }

      textarea {
        min-height: 48px;
        max-height: 150px;
        flex: 1;
        resize: vertical;
        border: 0;
        outline: none;
        line-height: 1.5;
      }

      .ask {
        min-width: 82px;
        border-radius: 7px;
        background: var(--brand);
        color: white;
        padding: 12px 16px;
        font-weight: 700;
      }

      .ask:hover {
        background: var(--brand-dark);
      }

      .ask:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      @media (max-width: 760px) {
        .shell {
          display: block;
        }

        aside {
          display: none;
        }

        .examples {
          grid-template-columns: 1fr;
        }

        .query {
          max-width: 92%;
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand">
          <img src="https://cusb.ac.in/images/cusb/logo-new1.png" alt="" />
          <div>
            <h1>CUSB RAG</h1>
            <p class="muted">Local live chatbot</p>
          </div>
        </div>
        <div id="status" class="status">Checking backend...</div>
      </aside>

      <main>
        <header>
          <h1>Central University of South Bihar Assistant</h1>
          <p class="muted">Ask about admissions, courses, faculty, fees, hostel, syllabus, and campus info.</p>
        </header>

        <section class="chat">
          <div class="inner">
            <div id="empty" class="empty">
              <div>
                <img src="https://cusb.ac.in/images/cusb/logo-new1.png" alt="" width="92" height="92" />
                <h2>How can I help you today?</h2>
                <div class="examples">
                  <button class="example" data-example="give me full information about CUSB">give me full information about CUSB</button>
                  <button class="example" data-example="hostel fee kya hai">hostel fee kya hai</button>
                  <button class="example" data-example="faculty name statistics department">faculty name statistics department</button>
                  <button class="example" data-example="M.Sc. Chemistry syllabus do">M.Sc. Chemistry syllabus do</button>
                </div>
              </div>
            </div>
            <div id="turns"></div>
          </div>
        </section>

        <footer>
          <form id="form">
            <div class="composer">
              <textarea id="query" placeholder="Message CUSB RAG..."></textarea>
              <button id="ask" class="ask" type="submit">Ask</button>
            </div>
          </form>
        </footer>
      </main>
    </div>

    <script>
      const apiBase = "http://127.0.0.1:8080";
      const statusEl = document.querySelector("#status");
      const turnsEl = document.querySelector("#turns");
      const emptyEl = document.querySelector("#empty");
      const formEl = document.querySelector("#form");
      const queryEl = document.querySelector("#query");
      const askEl = document.querySelector("#ask");

      async function checkHealth() {
        try {
          const res = await fetch(`${apiBase}/api/health`);
          const data = await res.json();
          statusEl.textContent = `Backend: ${data.status}\nRetriever: ${data.retriever}\nGPU: ${data.gpu?.available ? data.gpu.device : "CPU"}`;
        } catch (error) {
          statusEl.textContent = "Backend is not reachable.";
        }
      }

      function renderTurn(question, answer, sources, id) {
        emptyEl.style.display = "none";
        const wrapper = document.createElement("article");
        wrapper.className = "turn";
        if (id) {
          wrapper.dataset.turnId = id;
        }
        const sourceItems = (sources || [])
          .slice(0, 5)
          .map((source) => {
            const label = source.title || source.source_file || "CUSB source";
            const page = source.page ? ` p.${source.page}` : "";
            return `<span class="source">${escapeHtml(label)}${escapeHtml(page)}</span>`;
          })
          .join("");
        wrapper.innerHTML = `
          <div class="query">${escapeHtml(question)}</div>
          <div class="answer">${escapeHtml(answer)}</div>
          <div class="sources">${sourceItems}</div>
        `;
        turnsEl.appendChild(wrapper);
        wrapper.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      function updateTurn(id, answer, sources) {
        const wrapper = turnsEl.querySelector(`[data-turn-id="${id}"]`);
        if (!wrapper) return;
        const answerEl = wrapper.querySelector(".answer");
        const sourcesEl = wrapper.querySelector(".sources");
        if (answerEl) {
          answerEl.textContent = answer || "No answer returned.";
        }
        if (sourcesEl) {
          sourcesEl.innerHTML = (sources || [])
            .slice(0, 5)
            .map((source) => {
              const label = source.title || source.source_file || "CUSB source";
              const page = source.page ? ` p.${source.page}` : "";
              return `<span class="source">${escapeHtml(label)}${escapeHtml(page)}</span>`;
            })
            .join("");
        }
        wrapper.scrollIntoView({ behavior: "smooth", block: "end" });
      }

      function escapeHtml(value) {
        return String(value || "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      async function ask(question) {
        const clean = question.trim();
        if (!clean) return;
        const turnId = String(Date.now());
        askEl.disabled = true;
        askEl.textContent = "...";
        renderTurn(clean, "Searching CUSB sources...", [], turnId);
        try {
          const res = await fetch(`${apiBase}/api/chat`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ query: clean, filters: {} }),
          });
          const data = await res.json();
          updateTurn(turnId, data.answer || "No answer returned.", data.sources || []);
        } catch (error) {
          updateTurn(turnId, "Request failed. Please check that the backend is running.", []);
        } finally {
          askEl.disabled = false;
          askEl.textContent = "Ask";
        }
      }

      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        const question = queryEl.value;
        queryEl.value = "";
        ask(question);
      });

      queryEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          formEl.requestSubmit();
        }
      });

      document.querySelectorAll("[data-example]").forEach((button) => {
        button.addEventListener("click", () => {
          queryEl.value = button.dataset.example || "";
          queryEl.focus();
        });
      });

      checkHealth();
    </script>
  </body>
</html>
