services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      PYTHONPATH: /app
      VECTOR_BACKEND: ${DOCKER_VECTOR_BACKEND:-faiss}
      QDRANT_PATH: /app/data/qdrant_local
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-cusb_chunks}
    volumes:
      - ./data:/app/data
      - ./reports:/app/reports
      - ./eval:/app/eval
      - ./annotations:/app/annotations
    expose:
      - "8080"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    environment:
      NEXT_PUBLIC_API_BASE: http://backend:8080
    depends_on:
      - backend
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
